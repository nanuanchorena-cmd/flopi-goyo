<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Flopi & Goyo — ¡Nos casamos!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Texto base -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Cursiva tipo invitación -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#95c9e1;
      --card:#f8f5ec;
      --text:#322c2c;
      --muted:#6f6f6f;
      --accent:#f28aa3;
      --accent-soft:#fde4ec;
      --radius:22px;
      --shadow:0 18px 40px rgba(0,0,0,.08);
    }

    *{box-sizing:border-box;margin:0;padding:0;}

    body{
      font-family:'Inter',sans-serif;
      background:var(--bg);
      color:var(--text);
      text-align:center;
    }

    section{
      max-width:900px;
      margin:0 auto;
      padding:48px 20px;
    }

    /* ===== HERO ===== */
    .hero{
      max-width:1100px;
      margin:60px auto 20px;
      padding:0 20px;
    }

    .hero img{
      width:100%;
      height:auto;
      display:block;
      border-radius:22px;
    }

    /* ===== ICONOS ===== */
    .icon{
      width:54px;
      height:54px;
      margin:0 auto 16px;
      border-radius:50%;
      background:var(--accent-soft);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
    }

    /* ===== CARDS ===== */
    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:26px;
    }

    .card{
      background:var(--card);
      border-radius:var(--radius);
      padding:34px 26px;
      box-shadow:var(--shadow);
    }

    .card h3{
      font-family:'Pacifico', cursive;
      font-size:1.2rem;
      font-weight:400;
      margin-bottom:6px;
    }

    .card p{
      color:var(--muted);
      font-size:.95rem;
      line-height:1.6;
    }

    .btn-outline{
      display:inline-block;
      margin-top:18px;
      padding:10px 22px;
      border-radius:30px;
      border:1.5px solid var(--accent);
      color:var(--accent);
      text-decoration:none;
      font-size:.9rem;
    }

    /* ===== CTA ===== */
    .cta{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:42px 26px;
      max-width:760px;
      margin:0 auto;
    }

    .btn{
      display:inline-block;
      margin-top:18px;
      padding:12px 30px;
      border-radius:30px;
      background:var(--accent);
      color:#f8f5ec;
      text-decoration:none;
      font-size:.9rem;
    }

    footer{
      padding:40px 20px 60px;
      font-size:.85rem;
      color:var(--text);
    }

    /* ===== AJUSTE ESPACIO SOLO PRIMER BLOQUE ===== */
    .first-section{
      padding-top:24px;
    }

    @media(max-width:600px){
      section{padding:36px 16px;}
      .hero{margin-top:40px;}
      .first-section{padding-top:16px;}
    }
  </style>
</head>

<body>

  <!-- HERO -->
  <div class="hero">
    <img src="/images/hero-flopi-goyo.jpg" alt="Flopi y Goyo - Nos casamos">
  </div>

  <!-- CEREMONIA / FIESTA -->
  <section class="first-section">
    <div class="cards">
      <div class="card">
        <div class="icon">⛪</div>
        <h3>Ceremonia</h3>
        <p>
          Santa Rita, Boulogne<br>
          <strong>16:30 hs</strong>
        </p>
        <a class="btn-outline" target="_blank"
           href="https://www.google.com/maps/dir//Iglesia+Santa+Rita,+Darragueira+630,+Boulogne,+Buenos+Aires">
          Ver ubicación
        </a>
      </div>

      <div class="card">
        <div class="icon">🍾</div>
        <h3>Fiesta</h3>
        <p>
          Las Cortaderas, Tigre<br>
          <strong>18:00 hs</strong>
        </p>
        <a class="btn-outline" target="_blank"
           href="https://www.google.com/maps?daddr=J.+M.+Loreto+4600,+Dique+Luján,+Buenos+Aires">
          Ver ubicación
        </a>
      </div>
    </div>
  </section>

  <!-- RSVP -->
  <section>
    <div class="cta">
      <div class="icon">🔒</div>
      <h3 style="font-family:'Pacifico', cursive;">RSVP</h3>
      <a class="btn" href="https://docs.google.com/forms/d/e/1FAIpQLSfL6H8sjPBOcxHk3zhMHj9iaTm5v9VEZv3AKKNAw7TRZ0kFKg/viewform" target="_blank">
        Confirmar asistencia
      </a>
    </div>
  </section>

  <!-- REGALOS -->
  <section>
    <div class="cta">
      <div class="icon">🎁</div>
      <h3 style="font-family:'Pacifico', cursive;">Regalos</h3>
      <a class="btn" href="regalos.html">
        Ver lista de regalos
      </a>
    </div>
  </section>

  <footer>
    Flopi & Goyo · 14 de marzo de 2026
  </footer>

</body>
</html>
