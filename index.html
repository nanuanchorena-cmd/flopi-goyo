<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Flopi & Goyo — ¡Nos casamos!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&family=Pacifico&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#a9d6e8;
      --card:#fffaf4;
      --text:#2b2b2b;
      --muted:#6f6f6f;
      --pink:#f08fa3;
      --pink-soft:#fde3ea;
      --radius:22px;
      --shadow:0 18px 40px rgba(0,0,0,.08);
    }

    *{box-sizing:border-box;margin:0;padding:0;}

    body{
      font-family:'Inter',sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.7;
    }

    section{
      max-width:960px;
      margin:0 auto;
      padding:70px 20px;
      text-align:center;
    }

    h2{
      font-family:'Playfair Display',serif;
      font-size:2.2rem;
      color:var(--pink);
      margin-bottom:40px;
    }

    /* HEADER */
    .header{
      padding-top:60px;
      text-align:center;
    }

    .names{
      font-family:'Pacifico',cursive;
      font-size:2.9rem;
      margin-bottom:14px;
    }

    .names span{color:var(--pink);}

    .nos{
      font-family:'Playfair Display',serif;
      color:var(--pink);
      font-size:2.6rem;
      margin-bottom:6px;
    }

    .date{
      font-family:'Playfair Display',serif;
      font-weight:600;
      font-size:2.6rem;
      color:#000;
    }

    /* ICON */
    .icon{
      width:56px;height:56px;
      border-radius:50%;
      background:var(--pink-soft);
      display:flex;
      align-items:center;
      justify-content:center;
      margin:0 auto 18px;
    }

    .icon svg{
      width:26px;height:26px;
      stroke:var(--pink);
      fill:none;
      stroke-width:1.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    /* CARDS */
    .cards{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:30px;
      max-width:820px;
      margin:0 auto;
    }

    .card{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:42px 28px;
    }

    .card h3{
      font-family:'Playfair Display',serif;
      font-size:1.4rem;
      margin-bottom:6px;
    }

    .card p{
      color:var(--muted);
      font-size:1rem;
    }

    .btn{
      display:inline-block;
      margin-top:18px;
      padding:12px 22px;
      border-radius:999px;
      border:1px solid var(--pink);
      color:var(--pink);
      text-decoration:none;
      font-size:.9rem;
    }

    /* CTA */
    .cta{
      background:var(--card);
      border-radius:28px;
      box-shadow:var(--shadow);
      padding:60px 30px;
      max-width:820px;
      margin:0 auto 40px;
    }

    .cta h3{
      font-family:'Playfair Display',serif;
      font-size:1.5rem;
      margin-bottom:16px;
    }

    .cta a{
      display:inline-block;
      padding:14px 34px;
      background:var(--pink);
      color:white;
      border-radius:999px;
      text-decoration:none;
      font-size:.95rem;
    }

    footer{
      padding:60px 20px;
      text-align:center;
      font-size:.85rem;
      color:var(--muted);
    }

    @media(max-width:820px){
      .cards{grid-template-columns:1fr;}
      .names,.nos,.date{font-size:2.3rem;}
    }
  </style>
</head>

<body>

<!-- HEADER -->
<section class="header">
  <div class="names">Flopi <span>&</span> Goyo</div>
  <div class="nos">¡Nos casamos!</div>
  <div class="date">14.03.26</div>
</section>

<!-- DÓNDE Y CUÁNDO -->
<section>
  <h2>Dónde y cuándo</h2>

  <div class="cards">
    <div class="card">
      <div class="icon">
        <!-- iglesia -->
        <svg viewBox="0 0 24 24">
          <path d="M12 3v6"/>
          <path d="M7 9h10"/>
          <path d="M6 9v12h12V9"/>
        </svg>
      </div>
      <h3>Ceremonia</h3>
      <p>Santa Rita<br><strong>16:30 hs</strong></p>
      <a class="btn" href="https://www.google.com/maps/dir//Iglesia+Santa+Rita,+Darragueira+630,+B1609+Boulogne,+Provincia+de+Buenos+Aires" target="_blank">
        Ver ubicación
      </a>
    </div>

    <div class="card">
      <div class="icon">
        <!-- botellas -->
        <svg viewBox="0 0 24 24">
          <path d="M9 3v6"/>
          <path d="M15 3v6"/>
          <path d="M7 9h4v12H7z"/>
          <path d="M13 9h4v12h-4z"/>
        </svg>
      </div>
      <h3>Fiesta</h3>
      <p>Las Cortaderas<br><strong>18:00 hs</strong></p>
      <a class="btn" href="https://www.google.com/maps?daddr=J.+M.+Loreto+4600,+Dique+Luján" target="_blank">
        Ver ubicación
      </a>
    </div>
  </div>
</section>

<!-- RSVP -->
<section>
  <div class="cta">
    <div class="icon">
      <!-- candado -->
      <svg viewBox="0 0 24 24">
        <rect x="5" y="11" width="14" height="10" rx="2"/>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
      </svg>
    </div>
    <h3>RSVP</h3>
    <a href="#">Confirmar asistencia</a>
  </div>
</section>

<!-- REGALOS -->
<section>
  <div class="cta">
    <div class="icon">
      <!-- regalo -->
      <svg viewBox="0 0 24 24">
        <path d="M4 10h16v10H4z"/>
        <path d="M12 10v10"/>
        <path d="M4 10h16"/>
      </svg>
    </div>
    <h3>Regalos</h3>
    <a href="regalos.html">Ver lista de regalos</a>
  </div>
</section>

<!-- MÚSICA -->
<section>
  <div class="cta">
    <div class="icon">
      <!-- bola disco -->
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8"/>
        <path d="M12 4v16"/>
        <path d="M4 12h16"/>
      </svg>
    </div>
    <h3>Música</h3>
    <a href="#">Ir a la playlist</a>
  </div>
</section>

<footer>
  Flopi & Goyo · 14 de marzo de 2026
</footer>

</body>
</html>
