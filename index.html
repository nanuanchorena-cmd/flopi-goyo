<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Flopi & Goyo — ¡Nos casamos!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Texto base -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Cursiva tipo invitación -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#95c9e1;            /* celeste */
      --card:#f8f5ec;          /* blanco */
      --text:#322c2c;          /* negro */
      --muted:#6f6f6f;
      --accent:#f28aa3;        /* rosa (igual) */
      --accent-soft:#fde4ec;
      --radius:22px;
      --shadow:0 18px 40px rgba(0,0,0,.08);
    }

    *{box-sizing:border-box;margin:0;padding:0;}

    body{
      font-family:'Inter',sans-serif;
      background:var(--bg);
      color:var(--text);
      text-align:center;
    }

    section{
      max-width:900px;
      margin:0 auto;
      padding:48px 20px;
    }

    /* ===== TIPOGRAFÍA INVITACIÓN ===== */
    .script{
      font-family:'Pacifico', cursive;
      font-weight:400;
    }

    /* ===== HEADER ===== */
    .names{
      font-size:3.2rem;
      margin-top:60px;
      color:var(--text);
    }

    .names .amp{
      color:var(--accent);
    }

    .nos{
      color:var(--accent);
      font-size:2.4rem;
      margin-top:10px;
    }

    .date{
      font-size:2.4rem;
      margin-top:4px;
      color:var(--text);
    }

    /* ===== TITULOS ===== */
    h2{
      color:var(--accent);
      font-size:2.1rem;
      margin-bottom:34px;
    }

    /* ===== ICONOS ===== */
    .icon{
      width:54px;
      height:54px;
      margin:0 auto 16px;
      border-radius:50%;
      background:var(--accent-soft);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
    }

    /* ===== CARDS ===== */
    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:26px;
    }

    .card{
      background:var(--card);
      border-radius:var(--radius);
      padding:34px 26px;
      box-shadow:var(--shadow);
    }

    .card h3{
      font-size:1.05rem;
      font-weight:500;
      margin-bottom:6px;
    }

    .card p{
      color:var(--muted);
      font-size:.95rem;
      line-height:1.6;
    }

    .btn-outline{
      display:inline-block;
      margin-top:18px;
      padding:10px 22px;
      border-radius:30px;
      border:1.5px solid var(--accent);
      color:var(--accent);
      text-decoration:none;
      font-size:.9rem;
    }

    /* ===== CTA ===== */
    .cta{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:42px 26px;
      max-width:760px;
      margin:0 auto;
    }

    .btn{
      display:inline-block;
      margin-top:18px;
      padding:12px 30px;
      border-radius:30px;
      background:var(--accent);
      color:#f8f5ec;
      text-decoration:none;
      font-size:.9rem;
    }

    footer{
      padding:40px 20px 60px;
      font-size:.85rem;
      color:var(--text);
    }

    @media(max-width:600px){
      .names{font-size:2.6rem;}
      .nos,.date{font-size:2rem;}
      section{padding:36px 16px;}
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="names script">
    Flopi <span class="amp">&amp;</span> Goyo
  </div>

  <div class="nos script">¡Nos casamos!</div>
  <div class="date script">14.03.26</div>

  <!-- DONDE Y CUANDO -->
  <section>
    <h2 class="script">Dónde y cuándo</h2>

    <div class="cards">
      <div class="card">
        <div class="icon">⛪</div>
        <h3 class="script">Ceremonia</h3>
        <p>
          Santa Rita, Bulogne<br>
          <strong>16:30 hs</strong>
        </p>
        <a class="btn-outline" target="_blank"
           href="https://www.google.com/maps/dir//Iglesia+Santa+Rita,+Darragueira+630,+Boulogne,+Buenos+Aires">
          Ver ubicación
        </a>
      </div>

      <div class="card">
        <div class="icon">🍾</div>
        <h3 class="script">Fiesta</h3>
        <p>
          Las Cortaderas, Tigre<br>
          <strong>18:30 hs</strong>
        </p>
        <a class="btn-outline" target="_blank"
           href="https://www.google.com/maps?daddr=J.+M.+Loreto+4600,+Dique+Luján,+Buenos+Aires">
          Ver ubicación
        </a>
      </div>
    </div>
  </section>

  <!-- RSVP -->
  <section>
    <div class="cta">
      <div class="icon">🔒</div>
      <h3 class="script">RSVP</h3>
      <a class="btn" href="https://docs.google.com/forms/d/e/1FAIpQLSfL6H8sjPBOcxHk3zhMHj9iaTm5v9VEZv3AKKNAw7TRZ0kFKg/viewform" target="_blank">
        Confirmar asistencia
      </a>
    </div>
  </section>

  <!-- REGALOS -->
  <section>
    <div class="cta">
      <div class="icon">🎁</div>
      <h3 class="script">Regalos</h3>
      <a class="btn" href="regalos.html">
        Ver lista de regalos
      </a>
    </div>
  </section>

  <footer>
    Flopi & Goyo · 14 de marzo de 2026
  </footer>

</body>
</html>
