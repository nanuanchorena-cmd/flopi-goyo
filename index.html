<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Flopi & Goyo — ¡Nos casamos!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tipografías (NO TOCADAS) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#a8d6e8;
      --card:#fffaf3;
      --text:#2b2b2b;
      --accent:#f28da0;
      --shadow:0 18px 45px rgba(0,0,0,.08);
      --radius:22px;
    }

    *{box-sizing:border-box;margin:0;padding:0;}

    body{
      font-family:'Inter',sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.6;
    }

    section{
      max-width:900px;
      margin:0 auto;
      padding:40px 20px; /* 🔧 espacios achicados */
      text-align:center;
    }

    /* ===== TITULOS ===== */

    .names{
      font-family:'Playfair Display',serif;
      font-size:3rem;
      color:#000;
      margin-top:30px;
    }

    .nos-casamos{
      font-family:'Pacifico',cursive;
      color:var(--accent);
      font-size:2.3rem;
      margin-top:6px;
    }

    .date{
      font-family:'Pacifico',cursive;
      font-size:2.1rem;
      color:#000;
      margin-top:2px;
    }

    h2{
      font-family:'Pacifico',cursive;
      color:var(--accent);
      font-size:2.2rem;
      margin-bottom:30px;
    }

    /* ===== ICONOS ===== */

    .icon{
      width:42px;
      height:42px;
      border-radius:50%;
      background:rgba(242,141,160,.2);
      display:flex;
      align-items:center;
      justify-content:center;
      margin:0 auto 14px;
    }

    .icon svg{
      width:20px;
      height:20px;
      stroke:var(--accent);
      fill:none;
      stroke-width:1.8;
    }

    /* ===== CARDS ===== */

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:26px;
    }

    .card{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:36px 26px;
    }

    .card h3{
      font-family:'Playfair Display',serif;
      font-size:1.4rem;
      margin-bottom:6px;
    }

    .card p{
      font-size:.95rem;
      margin-bottom:16px;
    }

    .btn-outline{
      display:inline-block;
      padding:9px 22px;
      border-radius:999px;
      border:1px solid var(--accent);
      color:var(--accent);
      text-decoration:none;
      font-size:.85rem;
    }

    /* ===== CTA ===== */

    .cta{
      background:var(--card);
      border-radius:28px;
      box-shadow:var(--shadow);
      padding:40px 30px;
      margin-bottom:26px;
    }

    .cta h3{
      font-family:'Playfair Display',serif;
      font-size:1.45rem;
      margin-bottom:14px;
    }

    .cta a{
      display:inline-block;
      background:var(--accent);
      color:#fff;
      padding:11px 30px;
      border-radius:999px;
      text-decoration:none;
      font-size:.9rem;
    }

    footer{
      padding:30px 20px 50px;
      text-align:center;
      font-size:.8rem;
      opacity:.75;
    }

    /* ===== MOBILE ===== */

    @media(max-width:600px){
      .names{font-size:2.4rem;}
      .nos-casamos{font-size:2rem;}
      .date{font-size:1.9rem;}
      h2{font-size:2rem;}
    }
  </style>
</head>

<body>

<section>
  <div class="names">Flopi &amp; Goyo</div>
  <div class="nos-casamos">¡Nos casamos!</div>
  <div class="date">14.03.26</div>
</section>

<section>
  <h2>Dónde y cuándo</h2>

  <div class="cards">
    <div class="card">
      <div class="icon">
        <!-- Iglesia -->
        <svg viewBox="0 0 24 24">
          <path d="M12 3v6"></path>
          <path d="M5 10h14v11H5z"></path>
          <path d="M9 21v-6h6v6"></path>
        </svg>
      </div>
      <h3>Ceremonia</h3>
      <p>Santa Rita<br><strong>16:30 hs</strong></p>
      <a class="btn-outline" href="https://www.google.com/maps/dir//Iglesia+Santa+Rita,+Darragueira+630,+B1609+Boulogne,+Provincia+de+Buenos+Aires" target="_blank">
        Ver ubicación
      </a>
    </div>

    <div class="card">
      <div class="icon">
        <!-- Botellas -->
        <svg viewBox="0 0 24 24">
          <path d="M8 3h2v4H8z"></path>
          <path d="M14 3h2v4h-2z"></path>
          <path d="M7 7h4v14H7z"></path>
          <path d="M13 7h4v14h-4z"></path>
        </svg>
      </div>
      <h3>Fiesta</h3>
      <p>Las Cortaderas<br><strong>18:00 hs</strong></p>
      <a class="btn-outline" href="https://www.google.com/maps?daddr=J.+M.+Loreto+4600,+Dique+Luj%C3%A1n,+Provincia+de+Buenos+Aires" target="_blank">
        Ver ubicación
      </a>
    </div>
  </div>
</section>

<section>
  <div class="cta">
    <div class="icon">
      <!-- Candado -->
      <svg viewBox="0 0 24 24">
        <rect x="5" y="11" width="14" height="10" rx="2"></rect>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
      </svg>
    </div>
    <h3>RSVP</h3>
    <a href="#">Confirmar asistencia</a>
  </div>

  <div class="cta">
    <div class="icon">
      <!-- Regalo -->
      <svg viewBox="0 0 24 24">
        <path d="M3 10h18v11H3z"></path>
        <path d="M12 10v11"></path>
      </svg>
    </div>
    <h3>Regalos</h3>
    <a href="regalos.html">Ver lista de regalos</a>
  </div>

  <div class="cta">
    <div class="icon">
      <!-- Bola disco -->
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="7"></circle>
        <path d="M12 5v14M5 12h14"></path>
      </svg>
    </div>
    <h3>Música</h3>
    <a href="#">Ir a la playlist</a>
  </div>
</section>

<footer>
  Flopi &amp; Goyo · 14 de marzo de 2026
</footer>

</body>
</html>
